name: Publish and Release Android Library

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: 'Nome do módulo para publicar e liberar (ex: core-utils)'
        required: true
        type: choice
        options:
          - core-utils
          - core-android-utils
          - core-android-compose-utils
          - android-pdf-generator
          - compose-charts
          - firebase-toolkit
          - room-toolkit
          - health-connect-toolkit
          - ui-compose-components
          - work-manager-toolkit

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Publish Library to GitHub Packages
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          ./gradlew :${{ inputs.module_name }}:publish

  create_tag:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create Version Tag and Get Tag Name
        id: get_tag
        run: |
          OUTPUT=$(./gradlew :${{ inputs.module_name }}:createVersionTag)
          TAG=$(echo "$OUTPUT" | grep "Tag .* criada com sucesso" | sed 's/Tag //;s/ criada com sucesso.//')
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Push new tag to repository
        run: git push origin --tags

  create_release:
    runs-on: ubuntu-latest
    needs: create_tag
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Changelog Generator
        run: npm install -g conventional-changelog-cli

      - name: Generate Changelog
        id: generate_changelog
        run: |
          MODULE_NAME="${{ inputs.module_name }}"
          TAG_NAME="${{ needs.create_tag.outputs.tag_name }}"
          
          PREVIOUS_TAG=$(git describe --tags --match "${MODULE_NAME}-v*" --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1 --match="${MODULE_NAME}-v*") 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Previous tag for ${MODULE_NAME} is ${PREVIOUS_TAG}"
          
          CHANGELOG_BODY=$(conventional-changelog-cli -p angular --commit-path ./${MODULE_NAME} --lerna-package ${MODULE_NAME} --from ${PREVIOUS_TAG} --to ${TAG_NAME})
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "${CHANGELOG_BODY}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create_tag.outputs.tag_name }}
          release_name: 'Release ${{ inputs.module_name }} - ${{ needs.create_tag.outputs.tag_name }}'
          body: |
            ## Changelog
            
            ${{ env.CHANGELOG }}

          draft: false
          prerelease: false